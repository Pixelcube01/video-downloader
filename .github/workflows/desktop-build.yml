name: Build desktop apps

# Runs on every push to main (download the builds from the run's "Artifacts"),
# and on a version tag like v1.0.0 it also attaches them to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          - os: macos-15            # Apple Silicon (M1-M4)
            name: macos-arm64
            ffmpeg_url: https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          - os: macos-15-intel      # Intel Macs
            name: macos-intel
            ffmpeg_url: https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt

      - name: Download ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p vendor tmp
          curl -sSL -o tmp/ffmpeg.zip "${{ matrix.ffmpeg_url }}"
          unzip -q tmp/ffmpeg.zip -d tmp
          cp tmp/ffmpeg-*/bin/ffmpeg.exe vendor/ffmpeg.exe

      - name: Download ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p vendor tmp
          curl -sSL -o tmp/ffmpeg.zip "${{ matrix.ffmpeg_url }}"
          unzip -q tmp/ffmpeg.zip -d tmp
          cp tmp/ffmpeg vendor/ffmpeg
          chmod +x vendor/ffmpeg
          vendor/ffmpeg -version | head -1

      - name: Build with PyInstaller
        run: pyinstaller VideoDownloader.spec --noconfirm

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/VideoDownloader/* -DestinationPath "VideoDownloader-${{ matrix.name }}.zip"

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          # Ad-hoc sign so Apple Silicon will run it (not notarized: users right-click > Open the first time).
          codesign --force --deep --sign - "dist/Video Downloader.app"
          mkdir dmg
          cp -R "dist/Video Downloader.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Video Downloader" -srcfolder dmg -ov -format UDZO "VideoDownloader-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: VideoDownloader-${{ matrix.name }}
          path: |
            VideoDownloader-*.zip
            VideoDownloader-*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VideoDownloader-*.zip
            VideoDownloader-*.dmg
